name: Link rot

# Scheduled check for EXTERNAL link rot. Articles link to restaurants, hostels
# and tour operators that quietly close, and nothing else catches that: every
# other check we run finds OUR mistakes, this one finds the world changing.
#
# Scheduled (and on demand) rather than on push/PR, unlike lint.yml: a dead link
# is never caused by the commit in front of you, and hitting a few hundred
# external sites on every push would be slow and rude to those sites.
#
# It lives here rather than in a Claude cloud routine because that sandbox has
# no general web egress - it cannot reach the sites being checked (even
# example.com is refused by policy). GitHub's runners have real internet.
#
# NOTIFICATION: this opens a GitHub ISSUE and lets the job pass. It used to
# notify by failing the job, but a failed job is indistinguishable in an inbox
# from a failed "Lint site" run, and the two mean opposite things: Lint site
# failing means the last commit broke something and you should fix it now, Link
# rot means the outside world moved and nothing you did is wrong. Conflating
# them trains you to ignore both. The issue email also carries the dead links in
# the body instead of making you open a log, and the issue closes itself on the
# next clean run, so the inbox item is the work item.

on:
  schedule:
    # Every 2 days at 15:00 UTC = 8am Pacific during PDT, 7am once PST starts in
    # November. Cron has no true "every 48h", so this is odd days of the month
    # (1,3,5...31); the only wrinkle is a back-to-back run across a 31-day
    # boundary, which is harmless for a read-only check.
    - cron: "0 15 */2 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # check_links.py is stdlib-only (urllib + threads), so there is nothing to
      # install. It already skips google.com/maps links, which are ~1,975 of the
      # ~2,371 external URLs in the repo and effectively never rot.
      #
      # The exit code is captured rather than allowed to fail the step: dead
      # links are the expected finding here, not a build error. pipefail so tee
      # cannot swallow the checker's status.
      - name: Check external links
        id: check
        run: |
          set -o pipefail
          if python tools/check_links.py 2>&1 | tee link-report.txt; then
            echo "dead=0" >> "$GITHUB_OUTPUT"
          else
            echo "dead=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-report
          path: link-report.txt
          retention-days: 30

      - name: Open or update the link-rot issue
        if: steps.check.outputs.dead == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The scheduled link-rot check found external links that no longer resolve."
            echo
            echo "These are links in published articles pointing at the outside world: a"
            echo "restaurant that closed, a tour operator that changed domain. **Nothing in"
            echo "the repo is broken** - no commit caused this."
            echo
            echo "Fix by editing the page to a working URL, or drop the link if there is no"
            echo "replacement. This issue closes itself on the next clean run."
            echo
            echo '```'
            cat link-report.txt
            echo '```'
            echo
            echo "[Full run and downloadable report]($RUN_URL)"
          } > body.md

          # "  N dead / M checked" is the checker's summary line.
          COUNT=$(grep -oE '^ +[0-9]+ dead' link-report.txt | grep -oE '[0-9]+' | head -1)
          TITLE="Link rot: ${COUNT:-some} dead link(s)"

          # One rolling issue, matched by title prefix, so a recurring failure
          # comments on the existing thread instead of opening a new issue every
          # two days.
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title | startswith("Link rot:")) | .number' | head -1)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE"
            gh issue comment "$NUM" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Close the issue once links resolve
        if: steps.check.outputs.dead == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title | startswith("Link rot:")) | .number' | head -1)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" \
              --comment "All external links resolve again as of $(date -u '+%Y-%m-%d'). Closed automatically."
          fi
